databases:
  - name: driveease-db
    databaseName: driveease
    user: driveease_user
    plan: free

services:
  # Backend Service (Spring Boot via Docker)
  - type: web
    name: driveease-backend
    env: docker
    rootDir: backend
    plan: free
    healthCheckPath: /api/cars # Or a dedicated health endpoint
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: driveease-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: driveease-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: driveease-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: driveease-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: driveease-db
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: SERVER_PORT
        value: "8080"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://driveease-frontend.onrender.com"

  # Frontend Service (React/Vite Static Site)
  - type: web
    name: driveease-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: "https://driveease-backend.onrender.com"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
